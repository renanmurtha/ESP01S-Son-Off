; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino

; OTA: 64 KB de SPIFFS, o resto para o app (espaço p/ upload em rede)
board_build.ldscript = eagle.flash.1m64.ld

; Upload por rede (ArduinoOTA) - sem senha por enquanto
upload_protocol = espota
upload_port = 192.168.2.18

; COMENTE a linha abaixo para gerar SEM MQTT
; (o código C++ e a seção MQTT da página são compilados fora)
; PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH: pool de buffers de rede
; maior que o default (Lower Memory) - evita pacotes multicast (mDNS)
; descartados por falta de buffer. Custo: ~10 KB de RAM de heap.
build_flags =
  -DUSE_MQTT
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

lib_deps =
  WiFiManager
  ArduinoJson
  DNSServer
  ESP8266WebServer
  ESP8266WiFi
  knolleary/PubSubClient@^2.8

; Advanced
monitor_speed = 115200
